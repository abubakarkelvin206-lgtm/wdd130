<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, and customer support.">
    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="white water rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h2>Our Contact Information</h2>

            <p><strong>Address:</strong> 20 ugbor village road GRA, benin city, Edo State.</p>

            <p><strong>Phone:</strong> (234) 8135458337</p>

            <p><strong>Email:</strong> kingmoby19@gmail.com</p>
        </section>

        <section class="map">
            <h2> Find us </h2>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6658.311566757923!2d5.609788685341451!3d6.274002513431269!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785433355728!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <h2>Meet Our Team</h2>

        <section class="employees">


            <figure>
                <img src="images/employee1.jpeg" alt="prince money">
                <figcaption>prince money - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpeg" alt="brother alonso">
                <figcaption>brother alonso - Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="moby company">
                <figcaption>moby company- Customer Service</figcaption>
            </figure>
        </section>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form method="post" action="#">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label><br>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label><br>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>

                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly
                        newsletter</label>

                    <br><br>
                    <button type="submit">Send Message</button>
                </fieldset>
            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Adventure | Abubakar Kelvin</p>

    </footer>
</body>

</html>
